<!DOCTYPE html>
<!-- A Estrela Perdida · jogo de programação para crianças dos 6 aos 7 anos · Autor: Celestino Magalhães -->
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="author" content="Celestino Magalhães">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Estrela Perdida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Livro de histórias à noite: céu índigo à volta, tabuleiro como ilha iluminada, mesa de papel com cartões táteis em baixo */
  --night:#2b2d6e;
  --night-2:#1b1c4b;
  --star:#ffc93c;
  --paper:#fff4dc;
  --paper-d:#ead3a4;
  --ink:#2b2547;
  --display:"Grandstander","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  --card:clamp(54px, 9.4vh, 80px);
  --step:560ms;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 0%,#3b3d8e 0%,var(--night) 45%,var(--night-2) 100%) fixed;font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid #7ff3ff;outline-offset:3px}
input{user-select:text;-webkit-user-select:text}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6;animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.12;transform:scale(.5)}}
.screen{position:fixed;inset:0;display:none}
.screen.active{display:flex}
svg{overflow:visible}

/* ---------- Robôs e personagens ---------- */
.robot .m-sad,.robot .m-wow,.robot .back{display:none}
.mood-sad .m-happy,.mood-wow .m-happy{display:none}
.mood-sad .m-sad,.mood-wow .m-wow{display:inline}
.face-N .face{display:none}.face-N .back{display:inline}
.robot .look{transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .3s}
svg .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.friend .eye{animation-delay:-1.7s}
.robot .lid-sad{display:none}
.mood-sad .lid-sad{display:inline}
.robot .tip{animation:glowtip 1.6s ease-in-out infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes glowtip{50%{opacity:.55}}
.wave .arm-r{transform-origin:69px 71px;animation:waveArm 1s ease-in-out infinite}
@keyframes waveArm{0%,100%{transform:rotate(-95deg)}50%{transform:rotate(-132deg)}}
.bob{animation:bob 2.2s ease-in-out infinite}
.bob.d2{animation-delay:-1.1s}
@keyframes bob{50%{transform:translateY(-4%)}}
.pc.bob{animation:pcbob 2.2s ease-in-out infinite}
.pc.bob.d2{animation-delay:-1.1s}
@keyframes pcbob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-54%)}}
.pc.cheer{animation:pccheer .55s ease-in-out infinite}
@keyframes pccheer{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-60%) rotate(4deg)}}
.pc.glowy > svg{animation:glowy 2.4s ease-in-out infinite}
@keyframes glowy{50%{transform:scale(1.07) rotate(4deg);filter:drop-shadow(0 0 18px #ffe27a)}}

/* ---------- Ecrã de título ---------- */
#s-title{flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;text-align:center;color:#fff;padding:24px}
.t-hero{position:relative;width:min(620px,90vw);height:min(250px,32vh)}
.t-star{position:absolute;left:50%;top:48%;width:min(210px,26vh);transform:translate(-50%,-50%)}
.t-star svg{width:100%;animation:glowy 3s ease-in-out infinite}
.t-robot{position:absolute;bottom:0;width:min(140px,19vh)}
.t-robot.l{left:4%}.t-robot.r{right:4%}
.t-robot svg{width:100%}
h1.title{font-family:var(--display);font-weight:900;font-size:clamp(46px,9vw,110px);line-height:.95;margin:0;color:var(--star);text-shadow:0 6px 0 #c47c00,0 16px 34px rgba(0,0,0,.4);letter-spacing:.01em;text-wrap:balance}
h1.title span{display:inline-block;animation:dropIn .75s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 45ms)}
@keyframes dropIn{from{transform:translateY(-70px) rotate(-12deg);opacity:0}}
.t-sub{font-size:clamp(17px,2.4vw,24px);margin:0;opacity:.92}
.bigbtn{border:0;border-radius:999px;background:var(--star);color:var(--ink);display:inline-flex;align-items:center;gap:14px;padding:16px 38px 16px 26px;font-family:var(--display);font-weight:900;font-size:clamp(26px,3.4vw,38px);box-shadow:0 8px 0 #c47c00,0 18px 30px rgba(0,0,0,.35);transition:transform .12s}
.bigbtn svg{width:1.3em;height:1.3em}
.bigbtn:active{transform:translateY(5px);box-shadow:0 3px 0 #c47c00}
.bigbtn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.t-foot{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.ghostbtn{border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:10px 18px;display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:16px}
.ghostbtn svg{width:22px;height:22px}
.t-note{font-size:14px;opacity:.7;margin:0}
.t-author{margin:0;font-size:17px;opacity:.95}
.t-author b{font-family:var(--display);font-weight:900;color:var(--star);letter-spacing:.01em}

/* ---------- Escolha do robô ---------- */
#s-choose{flex-direction:column;align-items:center;justify-content:center;gap:3vh;color:#fff;padding:24px;text-align:center}
.ch-title{font-family:var(--display);font-weight:900;font-size:clamp(32px,5vw,58px);margin:0;color:var(--star);text-shadow:0 5px 0 #c47c00}
.ch-row{display:flex;gap:clamp(16px,4vw,48px);flex-wrap:wrap;justify-content:center}
.ch-card{width:min(260px,40vw);border:0;border-radius:32px;background:rgba(255,255,255,.1);padding:20px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;box-shadow:inset 0 0 0 4px rgba(255,255,255,.18);transition:transform .2s,box-shadow .2s}
.ch-card svg{width:78%}
.ch-card span{font-family:var(--display);font-weight:900;font-size:34px}
.ch-card.sel{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 6px var(--star),0 0 40px rgba(255,201,60,.5);transform:translateY(-6px)}

/* ---------- Cenas da história ---------- */
#s-scene{flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.scene-art{position:relative;width:min(100%,calc((100vh - 220px) * 16 / 9),1100px);aspect-ratio:16/9;border-radius:28px;overflow:hidden;box-shadow:0 0 0 6px rgba(255,255,255,.14),0 20px 50px rgba(0,0,0,.45);container-type:size}
.sa{position:absolute;inset:0;overflow:hidden}
.pc{position:absolute;transform:translate(-50%,-50%)}
.pc > svg{width:100%;display:block}
.bg-night{background:linear-gradient(#17184a,#34368a 68%,#5357ad)}
.bg-quinta{background:linear-gradient(#9fdcff,#e8f8ff 62%)}
.bg-floresta{background:linear-gradient(#8fd8c2,#e2f6ea 62%)}
.bg-praia{background:linear-gradient(#7fd0ff,#e4f6ff 52%)}
.bg-neve{background:linear-gradient(#b4cbf3,#f1f6ff 62%)}
.ground{position:absolute;left:-15%;right:-15%;top:62%;height:80%;border-radius:50% 50% 0 0/22% 22% 0 0}
.sea{position:absolute;left:0;right:0;top:50%;height:16%;background:linear-gradient(#3fb6e8,#7fd3f2)}
.hill{position:absolute;border-radius:50%}
.sdot{position:absolute;width:.4cqw;height:.4cqw;border-radius:50%;background:#fff;opacity:.8;animation:twinkle 3s ease-in-out infinite}
.snow i{position:absolute;top:-4%;width:1cqw;height:1cqw;border-radius:50%;background:#fff;opacity:.9;animation:snowfall linear infinite}
@keyframes snowfall{to{transform:translateY(110cqh)}}
.frag{animation:fragOut 2.8s ease-out infinite}
@keyframes fragOut{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}12%{opacity:1}100%{transform:translate(calc(-50% + var(--dx) * 1cqw),calc(-50% + var(--dy) * 1cqh)) scale(1) rotate(200deg);opacity:.95}}
.gather{animation:gatherIn 2.4s ease-in both}
@keyframes gatherIn{0%{transform:translate(calc(-50% + var(--dx) * 1cqw),calc(-50% + var(--dy) * 1cqh));opacity:1}85%{transform:translate(-50%,-50%) scale(.7);opacity:1}100%{transform:translate(-50%,-50%) scale(.2);opacity:0}}
.appear{animation:appear .8s 2.2s cubic-bezier(.3,1.6,.5,1) both}
@keyframes appear{from{transform:translate(-50%,-50%) scale(0);opacity:0}}
.wind{position:absolute;height:.7cqw;border-radius:99px;background:rgba(255,255,255,.35);animation:wind 1.8s linear infinite}
@keyframes wind{from{transform:translateX(-30cqw)}to{transform:translateX(120cqw)}}
.burst{position:absolute;width:0;height:0}
.burst i{position:absolute;left:0;top:0;width:1cqw;height:1cqw;margin:-.5cqw;border-radius:50%;background:var(--c);animation:burstOut 1.9s ease-out infinite;animation-delay:var(--dl)}
@keyframes burstOut{0%{transform:rotate(var(--a)) translateY(0);opacity:1}100%{transform:rotate(var(--a)) translateY(-11cqw);opacity:0}}
.fan{display:flex;justify-content:center}
.fan .card{--card:8.5cqw;margin:0 -.6cqw;transform:rotate(var(--rot)) translateY(var(--ty));cursor:default}
.scene-row{width:min(100%,1100px);display:flex;gap:12px;align-items:stretch}
.scene-text{flex:1;background:#fff;border-radius:22px;padding:14px 20px;font-size:clamp(18px,2.6vh,26px);line-height:1.38;margin:0;display:flex;align-items:center;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.scene-btns{display:flex;gap:10px;align-items:center}
.rbtn{width:64px;height:64px;border-radius:50%;border:0;display:grid;place-items:center;background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9cde8}
.rbtn svg{width:30px;height:30px}
.rbtn.go{width:84px;height:84px;background:var(--star);box-shadow:0 7px 0 #c47c00}
.rbtn.go svg{width:40px;height:40px}
.scene-top{width:min(100%,1100px);display:flex;justify-content:space-between;align-items:center;color:#fff}
.dots{display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.on{background:var(--star)}
.skip{background:none;border:0;color:#fff;opacity:.75;font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:4px}

/* ---------- Mapa ---------- */
#s-map{flex-direction:column}
.map-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 12px 12px}
#mapSvg{width:100%;height:100%}
.mnode{cursor:pointer}
.mnode .mn-bg{fill:#fff;stroke:var(--ink);stroke-width:4}
.mnode text{font-family:var(--display);font-weight:900;font-size:26px;fill:var(--ink)}
.mnode.locked{cursor:default}
.mnode.locked .mn-bg{fill:#9597c4}
.mnode.done .mn-bg{fill:#ffd23f}
.mnode .pulse{fill:none;stroke:var(--star);stroke-width:6;transform-box:fill-box;transform-origin:center;animation:ring 1.5s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.5);opacity:0}}
.mnode.shake .mn-in{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mlabel{font-family:var(--display);font-weight:700;font-size:24px;fill:#fff}
.mstar{cursor:pointer}
.bobsv{animation:bobY 1.6s ease-in-out infinite}
@keyframes bobY{50%{transform:translateY(-7px)}}

/* ---------- Barra de topo ---------- */
.topbar{flex:none;height:62px;display:flex;align-items:center;gap:12px;padding:0 16px;color:#fff}
.tbtn{width:50px;height:50px;border-radius:16px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;flex:none;position:relative}
.tbtn svg{width:28px;height:28px}
.tbtn.holding::after{content:"";position:absolute;inset:-4px;border-radius:19px;border:4px solid var(--star);clip-path:inset(0 100% 0 0);animation:holdfill .9s linear forwards}
@keyframes holdfill{to{clip-path:inset(0 0 0 0)}}
.tb-title{display:flex;flex-direction:column;line-height:1.12;min-width:0}
.tb-world{font-family:var(--display);font-weight:900;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-level{font-size:15px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-dots{display:flex;gap:7px;flex:none}
.tb-dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25)}
.tb-dots i.done{background:var(--star)}
.tb-dots i.cur{box-shadow:0 0 0 3px #fff}
.spacer{flex:1}
.meter{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:900;font-size:24px;color:var(--star);flex:none;font-variant-numeric:tabular-nums}
.meter svg{width:42px;height:42px}
.meter small{font-size:15px;color:#fff;opacity:.7}
.map-title{font-family:var(--display);font-weight:900;font-size:24px}

/* ---------- Ecrã de jogo ---------- */
#s-game{flex-direction:column}
.g-main{flex:1;min-height:0;display:grid;grid-template-columns:calc(var(--card) * 4 + 24px + 28px) 1fr;gap:16px;padding:4px 16px 12px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.friend-box{display:grid;grid-template-columns:calc(var(--card) * 1.15) 1fr;gap:12px;align-items:start}
.fb-portrait{background:radial-gradient(circle at 50% 38%,#ffffff,#e4edff);border:3px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.16);border-radius:24px;aspect-ratio:1;display:grid;place-items:center;padding:6px}
.fb-portrait svg{width:100%}
.fb-portrait.talk svg{animation:talk .32s ease-in-out infinite}
@keyframes talk{50%{transform:translateY(-4%) rotate(-3deg)}}
.fb-bubble{position:relative;background:#fff;border-radius:20px;padding:12px 14px 10px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.fb-bubble::before{content:"";position:absolute;left:-11px;top:24px;border:11px solid transparent;border-right-color:#fff;border-left:0}
.fb-bubble p{margin:0 0 10px;font-size:clamp(15px,2.15vh,18px);line-height:1.36}
.fb-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ibtn{width:46px;height:46px;border-radius:14px;border:0;background:#eef1ff;color:#4a3f8a;display:grid;place-items:center;box-shadow:0 4px 0 #c9d0f0;flex:none}
.ibtn svg{width:26px;height:26px}
.goal-row{display:flex;gap:3px;align-items:center;margin-left:auto;flex-wrap:wrap}
.goal-row .gi{width:30px;height:30px;transition:opacity .3s,filter .3s}
.goal-row .gi svg{width:100%;height:100%}
.goal-row .gi.off{opacity:.28;filter:grayscale(1)}
.goal-row .plus{font-family:var(--display);font-weight:900;color:#a99bd6;font-size:20px;margin:0 2px}
.palette-box{background:var(--paper);border-radius:24px;padding:12px 14px 14px;box-shadow:0 7px 0 var(--paper-d)}
.box-title{font-family:var(--display);font-weight:700;font-size:15px;color:#8a6a3a;display:flex;align-items:center;gap:8px;margin:0 0 9px}
.box-title svg{width:20px;height:20px}
#palette{display:grid;grid-template-columns:repeat(var(--cols,3),var(--card));gap:12px 8px;padding-bottom:6px}

.card{width:var(--card);height:var(--card);border:0;border-radius:calc(var(--card) * .22);background:var(--cc);color:#fff;box-shadow:0 calc(var(--card) * .07) 0 var(--cd),0 calc(var(--card) * .1) 12px rgba(40,20,60,.18),inset 0 2px 0 rgba(255,255,255,.38);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none;cursor:grab;position:relative;padding:0;font-family:var(--display);flex:none;transition:transform .15s,box-shadow .15s,filter .2s}
.card .ic{width:56%;height:56%;display:block}
.card .ic svg{width:100%;height:100%;display:block}
.card .lb{font-size:calc(var(--card) * .125);font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap}
.card:active{transform:translateY(3px)}
.card.off{filter:grayscale(.85) opacity(.45)}
.k-move{--cc:#1fb36b;--cd:#11884e}
.k-left{--cc:#ff8a2a;--cd:#d0610b}
.k-right{--cc:#8f5cf7;--cd:#6634d4}
.k-jump{--cc:#ee4f98;--cd:#c12a70}
.k-loop{--cc:#ffc72e;--cd:#d39800;color:var(--ink)}
.card.wiggle{animation:wiggle .4s}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.card.flash,.ploop.flash{animation:flashIn .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes flashIn{from{transform:scale(.4)}}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;transition:none;opacity:.95}
.ghost.card{box-shadow:0 calc(var(--card) * .07) 0 var(--cd),0 18px 30px rgba(0,0,0,.35)}
body.will-remove .ghost{opacity:.55;filter:grayscale(.7)}
.lifting{opacity:.25;pointer-events:none}
body.dragging,body.dragging *{cursor:grabbing!important}

.board-wrap{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.board{position:relative;isolation:isolate;border-radius:calc(var(--cell) * .24);background:var(--base);box-shadow:0 0 0 calc(var(--cell) * .09) var(--edge),0 calc(var(--cell) * .62) 46px rgba(0,0,0,.42);margin-bottom:calc(var(--cell) * .5)}
.board::after{content:"";position:absolute;z-index:-1;left:calc(var(--cell) * -.09);right:calc(var(--cell) * -.09);top:calc(100% + var(--cell) * .06);height:calc(var(--cell) * .5);border-radius:0 0 calc(var(--cell) * .6) calc(var(--cell) * .6)/0 0 calc(var(--cell) * .5) calc(var(--cell) * .5);background:repeating-linear-gradient(180deg,transparent 0 calc(var(--cell) * .13),rgba(0,0,0,.1) calc(var(--cell) * .13) calc(var(--cell) * .16)),linear-gradient(var(--earth),var(--earthD))}
.tiles{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.tile{position:absolute;left:calc(var(--x) * var(--cell));top:calc(var(--y) * var(--cell));width:var(--cell);height:var(--cell)}
.tile.base{background-image:radial-gradient(circle at 28% 26%,rgba(255,255,255,.2),transparent 42%),radial-gradient(circle at 78% 82%,rgba(0,0,0,.05),transparent 38%)}
.tile.base.alt{background-color:var(--base2)}
.tile.path::before{content:"";position:absolute;inset:6%;border-radius:26%;background:var(--pathBg);box-shadow:inset 0 calc(var(--cell) * -.07) 0 rgba(0,0,0,.13),inset 0 calc(var(--cell) * .04) 0 rgba(255,255,255,.35),0 calc(var(--cell) * .05) calc(var(--cell) * .05) rgba(0,0,0,.18)}
.tile.start::after{content:"";position:absolute;inset:27%;border-radius:50%;border:calc(var(--cell) * .05) dashed rgba(60,30,10,.25)}
.tile.gap{background:#3aa0dc}
.theme-neve .tile.gap{background:var(--base)}
.tile.gap svg{width:100%;height:100%;display:block}
.waves{animation:waveMove 2.6s linear infinite}
@keyframes waveMove{to{transform:translateX(-25px)}}
.decor{position:absolute;inset:4%;transform:rotate(var(--r)) scale(var(--s))}
.tuft{position:absolute;width:42%;height:42%;pointer-events:none}
.tuft svg{width:100%;height:100%;display:block}
.decor svg{width:100%;height:100%;display:block}
.item,.goal,.bfriend,.actor,.foot,.ripple{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transform:translate(calc(var(--x) * var(--cell)),calc(var(--y) * var(--cell)))}
.item svg{position:absolute;left:22%;top:20%;width:56%;height:56%;animation:bob 1.9s ease-in-out infinite}
.item.got svg{animation:popAway .45s forwards}
@keyframes popAway{40%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}
.goal{z-index:2}
.goal svg{position:absolute;left:7%;top:5%;width:86%;height:86%;animation:goalWob 2.6s ease-in-out infinite}
@keyframes goalWob{50%{transform:rotate(7deg) scale(1.05)}}
.goal.dim svg{filter:saturate(.3) brightness(.92);animation:snooze 3.2s ease-in-out infinite}
@keyframes snooze{50%{transform:scale(.95)}}
.st-sleep{display:none}
.dim .st-awake{display:none}
.dim .st-sleep{display:inline}
.zzz{display:none;position:absolute;right:2%;top:-8%;font-family:var(--display);font-weight:900;color:#fff;font-size:calc(var(--cell) * .26);text-shadow:0 2px 0 rgba(0,0,0,.25);animation:zz 2.2s ease-in-out infinite}
.goal.dim .zzz{display:block}
@keyframes zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(30%,-60%);opacity:0}}
.goal.burst svg{animation:goalBurst .8s ease-out}
@keyframes goalBurst{40%{transform:scale(1.5) rotate(20deg)}100%{transform:scale(1)}}
.bfriend{z-index:3}

.anim.sink{animation:sinkDown .7s ease-in forwards}

.anim.dance{animation:dance .7s ease-in-out infinite}
@keyframes dance{25%{transform:translateY(-16%) rotate(-10deg)}50%{transform:none}75%{transform:translateY(-16%) rotate(10deg)}}
.anim.nope{animation:nope .5s}
@keyframes nope{25%{transform:translateY(-10%)}50%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
.anim.wiggle{animation:wiggle .45s}
.dizzy{position:absolute;left:20%;right:20%;top:-6%;height:24%;animation:spinY 1s linear infinite;pointer-events:none}

@keyframes spinY{to{transform:rotate(360deg)}}
.ripple{z-index:4;pointer-events:none}
.ripple i{position:absolute;inset:20%;border-radius:50%;border:calc(var(--cell) * .05) solid #fff;animation:rip 1s ease-out forwards}
.ripple i:nth-child(2){animation-delay:.2s}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
.foot{z-index:4;pointer-events:none}
.foot span{position:absolute;inset:30%;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 calc(var(--cell) * .04) rgba(47,168,255,.85);display:grid;place-items:center;animation:footIn .3s both;animation-delay:var(--d)}
.foot span svg{width:70%;height:70%}
.foot.bye span{animation:footOut .5s forwards}
@keyframes footIn{from{transform:scale(0)}}
@keyframes footOut{to{transform:scale(0);opacity:0}}
#toast{position:absolute;top:4px;left:50%;transform:translate(-50%,-160%);background:#fff;border-radius:18px;padding:10px 18px;font-weight:700;font-size:clamp(16px,2.2vh,19px);box-shadow:0 6px 0 rgba(0,0,0,.18);z-index:20;transition:transform .35s cubic-bezier(.3,1.5,.5,1);max-width:94%;text-align:center;line-height:1.3;opacity:0;visibility:hidden}

.dock{flex:none;display:grid;grid-template-columns:1fr auto;gap:16px;padding:12px 16px 14px;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -6px 26px rgba(0,0,0,.28);margin:0 10px}
.track-area{display:flex;flex-direction:column;min-width:0}

.tr-count{font-variant-numeric:tabular-nums;background:#fff;border-radius:999px;padding:2px 12px;color:var(--ink)}

#track{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;align-items:flex-start;padding:12px 12px 16px;min-height:calc(var(--card) + 34px);max-height:calc(var(--card) * 2 + 60px);overflow-y:auto;border-radius:20px;border:3px dashed var(--paper-d);background:#fffaf0;transition:border-color .2s,box-shadow .2s}

.ploop.active{box-shadow:0 5px 0 #d39800,0 0 0 4px #fff,0 0 18px 6px rgba(255,214,64,.85)}
.loop-head{width:calc(var(--card) * .78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:grab;touch-action:none;color:var(--ink);flex:none}

.lnum{border:0;background:#fff;border-radius:12px;font-family:var(--display);font-weight:900;font-size:calc(var(--card) * .25);padding:2px 4px;min-width:90%;box-shadow:0 3px 0 #d9b04a;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}

.lb-empty{width:var(--card);height:var(--card);display:grid;place-items:center;font-size:calc(var(--card) * .55);color:rgba(160,110,0,.5);font-family:var(--display);font-weight:900}
.ploop.looping{box-shadow:0 5px 0 #d39800,0 0 0 4px #7ff3ff}
.pnode.run{transform:translateY(-6px) scale(1.08);box-shadow:0 0 0 4px #fff,0 0 22px 8px rgba(127,243,255,.95),0 calc(var(--card) * .07) 0 var(--cd);z-index:2}
.running-ui #palette,.running-ui #track{pointer-events:none}
.running-ui #palette{opacity:.55}
.controls{display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto;gap:10px 10px;align-content:center;align-items:center}
.cbtn{border:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-weight:700;font-size:13px;line-height:1}

.cbtn.play{width:calc(var(--card) * 1.42);height:calc(var(--card) * 1.42);border-radius:50%;background:#22c55e;color:#fff;box-shadow:0 7px 0 #15924a,0 12px 24px rgba(0,0,0,.18);grid-row:span 2}
.cbtn.play svg{width:44%;height:44%;margin-left:6%}

.cbtn.small:active{transform:translateY(3px);box-shadow:0 2px 0 #dcc392}
.nudge{animation:pulse 1.1s ease-in-out infinite}

details{background:#fff;border-radius:16px;padding:10px 14px;margin-top:8px}
summary{font-weight:700;cursor:pointer;font-size:16px}

/* =================== MOTOR DO JOGO (funções puras) =================== */
function cardsFor(cats,m){
  const out=[];
  if(cats.includes('move'))out.push(...(m==='rob'?['F']:['N','S','W','E']));
  if(cats.includes('turn')&&m==='rob')out.push('L','R');
  if(cats.includes('jump'))out.push(...(m==='rob'?['J']:['jN','jS','jW','jE']));
  if(cats.includes('loop'))out.push('loop');
  return out;
}
function newNode(type){const n={id:'n'+(++S.uid),type};if(type==='loop'){n.n=2;n.body=[];}return n;}
function parseProg(str){
  let i=0;
  function seq(){
    const out=[];
    while(i<str.length){
      const ch=str[i];
      if(ch===']'){i++;return out;}
      if(/\d/.test(ch)){let n='';while(/\d/.test(str[i]))n+=str[i++];i++;const lp=newNode('loop');lp.n=+n;lp.body=seq();out.push(lp);continue;}
      i++;
      if('FLRJNSEW'.includes(ch))out.push(newNode(ch));
      else if('nsew'.includes(ch))out.push(newNode('j'+ch.toUpperCase()));
    }
    return out;
  }
  return seq();
}
function countCards(list){return list.reduce((a,n)=>a+1+(n.type==='loop'?countCards(n.body):0),0);}
function flatten(list,ctx=[],out=[]){
  for(const n of list){
    if(n.type==='loop'){for(let k=0;k<n.n;k++)flatten(n.body,[...ctx,{id:n.id,k,n:n.n}],out);}
    else out.push({type:n.type,id:n.id,loops:ctx});
  }
  return out;
}
function cellAt(L,x,y){if(y<0||y>=L.map.length||x<0||x>=L.map[0].length)return null;return L.map[y][x];}
const walkable=ch=>!!ch&&'.SGc'.includes(ch);
function initState(L){
  const s={x:0,y:0,dir:L.dir||'E',got:new Set(),need:0};
  L.map.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='S'){s.x=x;s.y=y;}if(ch==='c')s.need++;}));
  return s;
}
function applyCmd(s,cmd,L){

  if(cmd==='L'||cmd==='R')return {kind:'turn',x,y,dir:cmd==='L'?LEFT[dir]:RIGHT[dir],turn:cmd==='L'?-1:1};
  let jump=false;
  if(cmd==='J')jump=true;
  else if(cmd.length===1&&'NSEW'.includes(cmd))dir=cmd;
  else if(cmd[0]==='j'){dir=cmd[1];jump=true;}
  const [dx,dy]=DIRS[dir];
  const c1=cellAt(L,x+dx,y+dy);
  if(!jump){
    if(c1===null)return {kind:'bump',x,y,dir};
    if(c1==='~')return {kind:'water',x:x+dx,y:y+dy,dir};
    if(!walkable(c1))return {kind:'bump',x,y,dir};
    return {kind:'move',x:x+dx,y:y+dy,dir};
  }
  if(c1!=='~')return {kind:'nojump',x,y,dir};
  const c2=cellAt(L,x+2*dx,y+2*dy);
  if(c2==='~')return {kind:'water',x:x+2*dx,y:y+2*dy,dir,jumped:true};
  if(!walkable(c2))return {kind:'bump',x,y,dir};
  return {kind:'jump',x:x+2*dx,y:y+2*dy,dir};
}
function land(st,L){
  const ch=L.map[st.y][st.x],o={};
  if(ch==='c'){const k=st.x+','+st.y;if(!st.got.has(k)){st.got.add(k);o.collected=k;if(st.got.size===st.need)o.wake=true;}}
  if(ch==='G'&&st.got.size===st.need)o.won=true;
  return o;
}
function simulate(L,prog){
  const st=initState(L),visited=[{x:st.x,y:st.y,dir:st.dir}];
  for(const s of flatten(prog)){
    const r=applyCmd(st,s.type,L);
    if(r.kind==='bump'||r.kind==='water'||r.kind==='nojump')return {res:r.kind,visited};
    st.x=r.x;st.y=r.y;st.dir=r.dir;
    if(r.kind!=='turn'){visited.push({x:st.x,y:st.y,dir:st.dir});if(land(st,L).won)return {res:'win',visited};}
  }
  return {res:L.map[st.y][st.x]==='G'?'items':'end',visited};
}

function eyeP(cx,cy,rx,ry,iris,o={}){
  const ir=+(o.ir||Math.min(rx,ry)*.72).toFixed(2),pr=+(ir*.5).toFixed(2),iy=+(cy+ry*.12).toFixed(2);

  return `<g class="eye"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${U('sclera')}" stroke="rgba(40,30,80,.28)" stroke-width=".8"/><g class="look"><circle cx="${cx}" cy="${iy}" r="${ir}" fill="${U(iris)}"/><circle cx="${cx}" cy="${iy}" r="${pr}" fill="#140f2c"/><circle cx="${(cx+ir*.38).toFixed(2)}" cy="${(iy-ir*.32).toFixed(2)}" r="${(ir*.36).toFixed(2)}" fill="#fff"/><circle cx="${(cx-ir*.34).toFixed(2)}" cy="${(iy+ir*.42).toFixed(2)}" r="${(ir*.16).toFixed(2)}" fill="#fff" opacity=".9"/></g>${lashes}</g>`;
}

function cardIcon(t){

  switch(t){
    case 'F':case 'N':return wrap(ARROW);
    case 'S':return wrap(rot(ARROW,180));
    case 'E':return wrap(rot(ARROW,90));
    case 'W':return wrap(rot(ARROW,-90));

    case 'R':return wrap('<path d="M15 42V25a9 9 0 0 1 9-9h13"/><path d="M29 8l8 8-8 8"/>');
    case 'J':case 'jN':return wrap(CHEV(0)+WAVE);

    case 'jE':return wrap(CHEV(90)+WAVE);
    case 'jW':return wrap(CHEV(-90)+WAVE);
    case 'loop':return wrap('<path d="M38 19a15 15 0 0 0-27-3"/><path d="M10 29a15 15 0 0 0 27 3"/><path d="M10 7v10h10"/><path d="M38 41V31H28"/>');

}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
const soundOn=()=>S.save.settings.sound&&!S.save.settings.mute;
function tone(f,d,o={}){
  const c=ac();if(!c||!soundOn())return;
  const {type='sine',vol=.16,to=null,delay=0}=o,t=c.currentTime+delay;
  const osc=c.createOscillator(),g=c.createGain();
  osc.type=type;osc.frequency.setValueAtTime(f,t);if(to)osc.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  osc.connect(g).connect(c.destination);osc.start(t);osc.stop(t+d+.03);
}
function noise(d,o={}){
  const c=ac();if(!c||!soundOn())return;
  const {vol=.2,freq=800,delay=0}=o,t=c.currentTime+delay;
  const b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  src.buffer=b;f.type='bandpass';f.frequency.value=freq;g.gain.value=vol;
  src.connect(f).connect(g).connect(c.destination);src.start(t);
}
const SFX={
  pop:()=>tone(520,.1,{type:'triangle',to:900,vol:.18}),
  tap:()=>tone(720,.06,{type:'triangle',vol:.1}),
  poof:()=>noise(.28,{freq:1400,vol:.18}),
  step:()=>{tone(330,.08,{type:'square',vol:.045});tone(440,.07,{type:'square',vol:.04,delay:.1});},
  turn:()=>tone(380,.2,{type:'triangle',to:640,vol:.12}),
  jump:()=>tone(260,.34,{type:'sine',to:1000,vol:.2}),
  bump:()=>{tone(220,.28,{type:'sine',to:70,vol:.25});tone(160,.12,{type:'square',vol:.05,delay:.05});},
  splash:()=>{noise(.55,{freq:650,vol:.3});tone(520,.32,{to:110,vol:.08});},
  nope:()=>{tone(300,.12,{type:'square',vol:.06});tone(220,.18,{type:'square',vol:.06,delay:.14});},
  collect:()=>[880,1175,1568].forEach((f,i)=>tone(f,.17,{type:'triangle',vol:.14,delay:i*.07})),
  wake:()=>[660,880,1320,1760].forEach((f,i)=>tone(f,.22,{type:'sine',vol:.12,delay:i*.08})),
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i===5?.55:.16,{type:'triangle',vol:.16,delay:i*.13})),
  star:i=>tone(700+i*240,.24,{type:'triangle',vol:.16}),
  fail:()=>[392,330,262].forEach((f,i)=>tone(f,.2,{type:'triangle',vol:.1,delay:.25+i*.15})),
  page:()=>tone(600,.12,{type:'sine',to:900,vol:.09})
};

let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/pt[-_]PT/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang))||null;}catch(e){VOICE=null;}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
let talkTimer=null;
function speak(text,opts={}){
  const st=S.save.settings;
  if(!('speechSynthesis' in window)||!st.voice||st.mute)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/[«»"]/g,''));
    u.lang=VOICE?VOICE.lang:'pt-PT';if(VOICE)u.voice=VOICE;u.rate=.92;u.pitch=1.1;
    const p=opts.talk?$('#fbPortrait'):null;
    if(p){p.classList.add('talk');clearTimeout(talkTimer);talkTimer=setTimeout(()=>p.classList.remove('talk'),Math.min(9000,text.length*75));u.onend=()=>p.classList.remove('talk');}
    setTimeout(()=>{try{speechSynthesis.speak(u);}catch(e){}},70);
  }catch(e){}
}

function friendSpot(L){

function updatePaletteState(){const full=countCards(S.prog)>=maxCards();$$('#palette .card').forEach(c=>c.classList.toggle('off',full));}
function findNode(id,list=S.prog){for(const n of list){if(n.id===id)return n;if(n.type==='loop'){const f=findNode(id,n.body);if(f)return f;}}return null;}
function detach(id,list=S.prog){const i=list.findIndex(n=>n.id===id);if(i>=0)return list.splice(i,1)[0];for(const n of list)if(n.type==='loop'){const f=detach(id,n.body);if(f)return f;}return null;}
function findEmptyLoop(list){for(const n of list)if(n.type==='loop'&&!n.body.length)return n;return null;}
function nodeEl(n){
  if(n.type==='loop'){
    const d=document.createElement('div');
    d.className='pnode ploop'+(S.target===n.id?' active':'');d.dataset.id=n.id;
    d.innerHTML=`<div class="loop-head"><span class="ic">${cardIcon('loop')}</span><button type="button" class="lnum" aria-label="Repetir ${NUMW[n.n]} vezes. Toca para mudar">×${n.n}</button></div><div class="loop-body" data-loop="${n.id}"></div>`;
    const head=$('.loop-head',d),body=$('.loop-body',d),num=$('.lnum',d);

    if(!n.body.length)body.insertAdjacentHTML('beforeend','<span class="lb-empty" aria-hidden="true">+</span>');

  }
  const c=makeCard(n.type,'pnode');c.dataset.id=n.id;

function renderProgram(){

function setTarget(t,quiet){

function flashNode(id){const el=$(`.pnode[data-id="${id}"]`);if(el){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),500);}}
function full(){

function tapAdd(type){
  if(S.running||S.stepping)return;
  ac();
  if(countCards(S.prog)+1>maxCards())return full();
  const node=newNode(type);let list=S.prog;

function invalidateRun(){if(S.exec)resetActor(false);}

/* ----- Arrastar (rato e toque) ----- */
let D=null;
function dragStart(e,src,el){
  if(e.button!==undefined&&e.button!==0)return;
  e.stopPropagation();
  if(S.running||S.stepping)return;
  e.preventDefault();ac();hideHand();
  D={src,x0:e.clientX,y0:e.clientY,moved:false,el:el||e.currentTarget,target:null,pid:e.pointerId};
  window.addEventListener('pointermove',dragMove,{passive:false});
  window.addEventListener('pointerup',dragEnd);
  window.addEventListener('pointercancel',dragCancel);
}
function dragMove(e){
  if(!D||e.pointerId!==D.pid)return;
  e.preventDefault();
  if(!D.moved){if(Math.hypot(e.clientX-D.x0,e.clientY-D.y0)<8)return;D.moved=true;makeGhost();}
  D.ghost.style.transform=`translate(${e.clientX-D.ox}px,${e.clientY-D.oy}px) rotate(-5deg) scale(1.06)`;
  findDrop(e.clientX,e.clientY);
}
function makeGhost(){
  const r=D.el.getBoundingClientRect();
  const g=(D.src.from==='prog'&&D.src.type==='loop')?D.el.cloneNode(true):makeCard(D.src.type);
  g.classList.add('ghost');g.classList.remove('run','active','lifting');
  g.style.width=r.width+'px';g.style.height=r.height+'px';
  D.ox=D.x0-r.left;D.oy=D.y0-r.top;
  document.body.appendChild(g);D.ghost=g;
  if(D.src.from==='prog')D.el.classList.add('lifting');
  document.body.classList.add('dragging');sfx('tap');
}
function findDrop(x,y){
  const el=document.elementFromPoint(x,y);
  let cont=el&&el.closest('.loop-body, #track');
  if(cont&&cont.classList.contains('loop-body')&&D.src.type==='loop')cont=$('#track');
  if(!cont){D.target=null;removeMarker();document.body.classList.toggle('will-remove',D.src.from==='prog');return;}
  document.body.classList.remove('will-remove');
  const idx=computeIndex(cont,x,y);
  D.target={list:cont.id==='track'?'main':cont.dataset.loop,idx};
  placeMarker(cont,idx);
}
function kidsOf(cont){return [...cont.children].filter(c=>c.classList.contains('pnode')&&!c.classList.contains('lifting'));}
function computeIndex(cont,x,y){
  const kids=kidsOf(cont);
  for(let i=0;i<kids.length;i++){const r=kids[i].getBoundingClientRect();if(y<r.top)return i;if(y<=r.bottom&&x<r.left+r.width/2)return i;}
  return kids.length;
}
function placeMarker(cont,idx){
  let m=$('#dropMarker');
  if(!m){m=document.createElement('div');m.id='dropMarker';m.className='drop-marker';}
  const kids=kidsOf(cont);
  const before=kids[idx]||cont.querySelector(':scope > .slot, :scope > .empty-hint, :scope > .lb-empty')||null;
  if(m.parentNode!==cont||m.nextSibling!==before)cont.insertBefore(m,before);
}
function removeMarker(){const m=$('#dropMarker');if(m)m.remove();}
function dragCleanup(){
  window.removeEventListener('pointermove',dragMove);window.removeEventListener('pointerup',dragEnd);window.removeEventListener('pointercancel',dragCancel);
  removeMarker();document.body.classList.remove('dragging','will-remove');
}
function dragCancel(){if(!D)return;dragCleanup();if(D.ghost)D.ghost.remove();if(D.el)D.el.classList.remove('lifting');D=null;}
function dragEnd(e){
  if(!D||e.pointerId!==D.pid)return;
  dragCleanup();const d=D;D=null;
  if(!d.moved){
    if(d.src.from==='pal')tapAdd(d.src.type);
    else if(d.src.type==='loop')setTarget(d.src.id);
    else{d.el.classList.remove('wiggle');void d.el.offsetWidth;d.el.classList.add('wiggle');sayCard(d.src.type);}
    return;
  }
  d.ghost.remove();d.el.classList.remove('lifting');
  if(d.target)return dropInto(d,d.target);
  if(d.src.from==='prog'){detach(d.src.id);puffAt(e.clientX,e.clientY);sfx('poof');invalidateRun();renderProgram();}
}
function dropInto(d,t){
  let node;
  if(d.src.from==='pal'){if(countCards(S.prog)+1>maxCards())return full();node=newNode(d.src.type);}
  else{node=detach(d.src.id);if(!node)return;}
  let list=S.prog;
  if(t.list!=='main'){const lp=findNode(t.list);if(lp&&lp!==node)list=lp.body;}
  list.splice(Math.min(t.idx,list.length),0,node);
  if(node.type==='loop')S.target=node.id;else if(t.list!=='main')S.target=t.list;
  sfx('pop');if(d.src.from==='pal')sayCard(node.type);
  invalidateRun();renderProgram();flashNode(node.id);
}

/* ----- Executar ----- */
function setRunUI(on){
  document.body.classList.toggle('running-ui',on);
  const p=$('#btnPlay');p.classList.toggle('stop',on);p.innerHTML=on?UI.stop:UI.play;
  p.setAttribute('aria-label',on?'Parar':'Executar o programa');
  if(on)p.classList.remove('nudge');
}
function prepare(){
  if(!S.prog.length){const m='Primeiro põe cartões no teu programa!';toast(m);bubbleSay(m);sfx('nope');showHand();return false;}
  const el=findEmptyLoop(S.prog);
  if(el){const m='O Repetir está vazio! Põe cartões lá dentro.';toast(m);bubbleSay(m);sfx('nope');setTarget(el.id,true);flashNode(el.id);return false;}
  const st=initState(LV());
  S.exec=Object.assign(st,{steps:flatten(S.prog),i:0,done:false});
  setMood('');clearHighlights();
  return true;
}
async function onPlay(){
  ac();
  if(S.running){S.running=false;return;}
  if(S.stepping)return;
  if(S.exec&&S.exec.done){resetActor(false);await sleep(380);}
  if(!S.exec&&!prepare())return;
  S.running=true;setRunUI(true);
  while(S.running&&S.exec&&!S.exec.done&&S.exec.i<S.exec.steps.length)await doStep();
  if(S.exec&&!S.exec.done&&S.exec.i>=S.exec.steps.length)finishEnd();
  S.running=false;setRunUI(false);
}
async function onStep(){
  ac();
  if(S.running||S.stepping)return;
  S.stepping=true;
  if(S.exec&&S.exec.done){resetActor(false);await sleep(380);}
  if(!S.exec&&!prepare()){S.stepping=false;return;}
  await doStep();
  if(S.exec&&!S.exec.done&&S.exec.i>=S.exec.steps.length)finishEnd();
  S.stepping=false;
}
function highlight(st){
  $$('.pnode.run').forEach(e=>e.classList.remove('run'));
  const el=$(`#track .pnode[data-id="${st.id}"]`);
  if(el){el.classList.add('run');try{el.scrollIntoView({block:'nearest',inline:'nearest'});}catch(e){}}
  $$('#track .ploop').forEach(lp=>{
    const ctx=st.loops.find(c=>c.id===lp.dataset.id),num=$('.lnum',lp),n=findNode(lp.dataset.id);
    if(ctx){lp.classList.add('looping');num.textContent=`${ctx.k+1}/${ctx.n}`;}
    else{lp.classList.remove('looping');if(n)num.textContent='×'+n.n;}
  });
}
function clearHighlights(){
  $$('.pnode.run').forEach(e=>e.classList.remove('run'));
  $$('#track .ploop').forEach(lp=>{lp.classList.remove('looping');const n=findNode(lp.dataset.id);if(n)$('.lnum',lp).textContent='×'+n.n;});
}
function angDelta(a,b){return ((ANG[b]-ANG[a]+540)%360)-180;}
async function doStep(){
  const ex=S.exec,L=LV(),T=stepMs();if(!ex)return;
  const alive=()=>S.exec===ex&&S.screen==='game';
  const wait=async ms=>{await sleep(ms);return alive();};
  const st=ex.steps[ex.i++];highlight(st);
  const r=applyCmd(ex,st.type,L);
  if(r.kind!=='turn'&&r.dir!==ex.dir){S.ang+=angDelta(ex.dir,r.dir);ex.dir=r.dir;setRing();setFaceDir(ex.dir);sfx('turn');if(!await wait(T*.5))return;}
  switch(r.kind){
    case 'turn':S.ang+=r.turn*90;ex.dir=r.dir;setRing();setFaceDir(ex.dir);animA('wiggle');sfx('turn');await wait(T);return;
    case 'move':ex.x=r.x;ex.y=r.y;setPos(r.x,r.y);animA('hop');sfx('step');if(!await wait(T))return;return afterLand();
    case 'jump':$('#actor').classList.add('leap');ex.x=r.x;ex.y=r.y;setPos(r.x,r.y);animA('arc');sfx('jump');if(!await wait(T*1.45))return;$('#actor').classList.remove('leap');return afterLand();
    case 'water':{
      if(r.jumped){$('#actor').classList.add('leap');animA('arc');sfx('jump');}else animA('hop');
      ex.x=r.x;ex.y=r.y;setPos(r.x,r.y);if(!await wait(r.jumped?T*1.45:T*.9))return;
      $('#actor').classList.remove('leap');animA('sink');sfx('splash');ripple(r.x,r.y);if(!await wait(650))return;return fail('water');}
    case 'bump':{
      const [dx,dy]=DIRS[r.dir],a=$('#actorAnim');a.style.setProperty('--bx',dx*24+'%');a.style.setProperty('--by',dy*24+'%');
      animA('bump');sfx('bump');setMood('sad');dizzy();if(!await wait(700))return;return fail('block');}
    case 'nojump':animA('nope');sfx('nope');if(!await wait(550))return;return fail('nojump');
  }
}
function afterLand(){
  const ex=S.exec,L=LV();if(!ex)return;
  const o=land(ex,L);
  if(o.collected)collectFx(o.collected);
  if(o.wake)setTimeout(()=>{const g=$('#goal');if(g){g.classList.remove('dim');g.classList.add('burst');sfx('wake');const rc=g.getBoundingClientRect();sparkle(rc.left+rc.width/2,rc.top+rc.height/2,10);}},320);
  if(o.won){ex.done=true;S.running=false;win();}
}
function collectFx(k){
  const el=$(`.item[data-k="${k}"]`);if(!el)return;
  el.classList.add('got');sfx('collect');
  const slot=$('#goalRow .islot.off');
  if(slot){slot.classList.remove('off');slot.classList.add('pending');slot.style.opacity='.28';flyTo($('svg',el),slot,itemSVG(WORLDS[LV().w].item),()=>{slot.style.opacity='';slot.classList.remove('pending');});}
}
function finishEnd(){
  const ex=S.exec,L=LV();if(!ex)return;
  fail(L.map[ex.y][ex.x]==='G'&&ex.got.size<ex.need?'items':'end');
}
function fail(kind){
  const ex=S.exec;if(ex)ex.done=true;S.running=false;
  const W=WORLDS[LV().w];
  const msgs={
    block:'Ups! Por ali não há caminho. Vamos tentar outra vez?',
    water:`Splash! {O_nome} ${W.fall||'caiu à água'}! Experimenta saltar.`,
    nojump:`Só dá para saltar quando há ${W.ahead||'água'} à frente!`,
    end:'Quase! {O_nome} ainda não chegou à estrela. Repara no caminho e muda os cartões.',
    items:`Quase! Ainda faltam ${W.items}. Apanha-os todos!`
  };
  const m=fmt(msgs[kind]);
  setMood('sad');sfx('fail');toast(m);bubbleSay(m);
  $('#btnReset').classList.add('nudge');

async function win(){
  const L=LV(),used=countCards(S.prog),opt=countCards(parseProg(L.sol[mode()]));
  const stars=used<=opt?3:used<=opt+3?2:1,prev=S.save.stars[S.li]||0;
  S.save.stars[S.li]=Math.max(prev,stars);persist();
  setMood('wow');animA('dance');
  const g=$('#goal');if(g){g.classList.add('burst');}
  const bf=$('#bfriend');if(bf)bf.classList.add('cheer');
  sfx('win');confetti();
  const line=pick(WIN_LINES);bubbleSay(line);
  if(g){const meter=$('#meterGame .meter svg');if(meter&&prev===0)setTimeout(()=>flyTo($('svg',g),meter,plainStar(),()=>{updateMeters();renderTop();sparkleAtEl(meter);}),500);else renderTop();}
  await sleep(1900);
  if(S.screen==='game')showWinModal(stars,line);
}
function showWinModal(stars,line){
  const L=LV(),W=WORLDS[L.w],R=S.save.robot||'bip';
  const msg=stars===3?'Programa perfeito!':stars===2?'Muito bem! Consegues usar menos cartões?':'Conseguiste! Com menos cartões ganhas mais estrelas.';
  const m=$('#modal');
  m.innerHTML=`<div class="panel"><div class="win-art"><div class="bob">${robotSVG(R,'mood-wow wave')}</div><div class="wa-star">${starSVG('')}</div><div class="bob d2">${friendSVG(W.friend)}</div></div>
  <div class="win-stars">${[0,1,2].map(i=>`<span class="ws ${i<stars?'on':''}" style="--d:${(.25+i*.35).toFixed(2)}s">${plainStar()}</span>`).join('')}</div>
  <h2>${line}</h2><p>${msg}</p>
  <div class="btnrow"><button class="wbtn" id="wRetry">${UI.reset}<span>Repetir</span></button><button class="wbtn" id="wMap">${UI.map}<span>Mapa</span></button><button class="wbtn main" id="wNext">${UI.next}<span>Seguinte</span></button></div></div>`;
  m.classList.add('show');
  for(let i=0;i<stars;i++)setTimeout(()=>sfx('star',i),250+i*350);
  setTimeout(()=>speak(msg),300);
  $('#wRetry').onclick=()=>{closeModal();openLevel(S.li);};
  $('#wMap').onclick=()=>{closeModal();showMap();};
  $('#wNext').onclick=()=>{
    closeModal();const i=S.li;
    if(i===LEVELS.length-1)return playScene(STORY.final,showDiploma);
    if(i%3===2)return playScene([{art:'obrigado-'+L.w,text:W.outro}],showMap);
    openLevelFlow(i+1);
  };
  setTimeout(()=>$('#wNext').focus(),50);
}

let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3600);}
function flyTo(srcEl,dstEl,html,done){
  if(!srcEl||!dstEl){done&&done();return;}
  const a=srcEl.getBoundingClientRect(),b=dstEl.getBoundingClientRect();
  const f=document.createElement('div');f.className='flyer';f.innerHTML=html;
  Object.assign(f.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'});
  $('#fx').appendChild(f);void f.offsetWidth;
  const sc=Math.max(.3,b.width/Math.max(1,a.width));
  f.style.transform=`translate(${b.left+b.width/2-(a.left+a.width/2)}px,${b.top+b.height/2-(a.top+a.height/2)}px) scale(${sc})`;
  setTimeout(()=>{f.remove();done&&done();},720);
}
function sparkle(x,y,n=8){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='spark';s.textContent='✦';const a=Math.random()*Math.PI*2,d=40+Math.random()*50;s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');$('#fx').appendChild(s);setTimeout(()=>s.remove(),850);}}
function sparkleAtEl(el){const r=el.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2,10);}
function puffAt(x,y){for(let i=0;i<7;i++){const p=document.createElement('span');p.className='puff';const a=i/7*Math.PI*2;p.style.left=(x-13)+'px';p.style.top=(y-13)+'px';p.style.setProperty('--dx',Math.cos(a)*36+'px');p.style.setProperty('--dy',Math.sin(a)*36+'px');$('#fx').appendChild(p);setTimeout(()=>p.remove(),650);}}
function confetti(){const cols=['#ffd23f','#ff6fa8','#3d8bfd','#22c55e','#a78bfa','#ff8a2a'];for(let i=0;i<80;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.setProperty('--dx',(Math.random()*160-80)+'px');c.style.setProperty('--rot',(Math.random()*900-450)+'deg');c.style.animationDelay=(Math.random()*.5)+'s';c.style.animationDuration=(2+Math.random()*1.4)+'s';$('#fx').appendChild(c);setTimeout(()=>c.remove(),4200);}}
function ripple(x,y){$('#board').insertAdjacentHTML('beforeend',`<div class="ripple" style="--x:${x};--y:${y}"><i></i><i></i></div>`);}
function dizzy(){const a=$('#actorAnim');a.insertAdjacentHTML('beforeend','<div class="dizzy"><b style="left:0;top:0">✦</b><b style="right:0;top:10%">✦</b><b style="left:40%;bottom:0">✦</b></div>');setTimeout(()=>{const d=$('.dizzy',a);if(d)d.remove();},1600);}
function showHand(){
  const from=$('#palette .card'),to=$('#track');if(!from||!to||S.screen!=='game')return;
  const h=$('#hand');h.innerHTML=UI.finger;

}

  ac();renderTeacher();showScreen('teacher');
  const mn=$('#tpMain');if(mn)mn.scrollTop=0;
  setTimeout(()=>{const b=$('#tpBack');if(b)b.focus({preventScroll:true});},50);
}
function closeTeacher(){
  if(S.tpIO){S.tpIO.disconnect();S.tpIO=null;}
  const p=S.prevScreen||'title';
  if(p==='game'){showScreen('game');renderTop();requestAnimationFrame(()=>{fitBoard();resetActor(true);});}
  else if(p==='map')showMap();
  else renderTitle();
}
function renderTeacher(){
  const back={game:'Voltar ao jogo',map:'Voltar ao mapa'}[S.prevScreen]||'Voltar ao início';
  const nav=TP_NAV.map(([g,items])=>`<p class="tp-group">${g}</p>`+items.map(([id,l])=>`<a href="#${id}" data-go="${id}">${l}</a>`).join('')).join('');
  const T=$('#s-teacher');
  T.innerHTML=`<header class="tp-head"><button type="button" class="tp-back" id="tpBack">${UI.back}<span>${back}</span></button><div class="tp-titles"><h1>Área do Professor</h1><p>A Estrela Perdida · Autor: Celestino Magalhães</p></div><div class="tp-art" aria-hidden="true">${robotSVG('bip','wave')}${starSVG()}${robotSVG('lua')}</div></header>
  <div class="tp-body"><nav class="tp-nav" aria-label="Secções da Área do Professor">${nav}</nav><main class="tp-main" id="tpMain">${tpSections()}</main></div>`;
  $('#tpBack').onclick=closeTeacher;
  const main=$('#tpMain'),links=$$('.tp-nav a',T);
  links.forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const s=document.getElementById(a.dataset.go);if(s)main.scrollTo({top:s.offsetTop-12,behavior:'smooth'});links.forEach(x=>x.classList.toggle('on',x===a));}));
  links[0].classList.add('on');
  if('IntersectionObserver' in window){
    if(S.tpIO)S.tpIO.disconnect();
    S.tpIO=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.dataset.go===en.target.id));});},{root:main,rootMargin:'0px 0px -70% 0px',threshold:0});
    $$('section',main).forEach(s=>S.tpIO.observe(s));
  }
  const st=S.save.settings;
  $$('input[name="mode"]',T).forEach(r=>r.addEventListener('change',()=>{
    S.save.mode=r.value;persist();$$('.opt',T).forEach(o=>o.classList.toggle('sel',$('input',o).checked));
    if(S.prevScreen==='game'){S.prog=[];S.target='main';renderPalette();renderProgram();resetActor(true);S.levelText=fmt(byMode(LV().say));$('#fbText').textContent=S.levelText;}
  }));
  $('#tVoice').onchange=e=>{st.voice=e.target.checked;persist();if(!st.voice)try{speechSynthesis.cancel();}catch(_){}};
  $('#tCard').onchange=e=>{st.cardVoice=e.target.checked;persist();};
  $('#tSound').onchange=e=>{st.sound=e.target.checked;persist();};
  $$('.seg button',T).forEach(b=>b.onclick=()=>{st.speed=b.dataset.sp;persist();applySpeed();$$('.seg button',T).forEach(x=>x.classList.toggle('sel',x===b));});
  $('#tUnlock').onchange=e=>{S.save.unlockAll=e.target.checked;persist();};
  const rb=$('#tReset');
  rb.onclick=()=>{
    if(!rb.classList.contains('armed')){rb.classList.add('armed');rb.textContent='Tem a certeza? Carregue outra vez para apagar';return;}
    const keep={robot:S.save.robot,mode:S.save.mode,settings:S.save.settings};
    S.save=Object.assign(defSave(),keep);persist();rb.classList.remove('armed');rb.textContent='Progresso apagado';
    $('#tUnlock').checked=false;
  };
}

/* =================== ARRANQUE =================== */
function bindStatic(){
  if(!document.getElementById('gdefs'))document.body.insertAdjacentHTML('afterbegin',buildDefs());
  const sky=$('#sky'),r=rng(42);let h='';
  for(let i=0;i<70;i++)h+=`<i style="left:${(r()*100).toFixed(2)}%;top:${(r()*100).toFixed(2)}%;animation-delay:${(-r()*3.4).toFixed(2)}s;${r()<.2?'width:4px;height:4px;':''}"></i>`;
  sky.innerHTML=h;
  $('#btnStart').onclick=startGame;
  $('#btnChange').onclick=()=>{ac();showChoose();};
  $('#chGo').onclick=()=>{
    if(!chosen)return;ac();sfx('pop');const changed=S.save.robot!==chosen;S.save.robot=chosen;persist();
    if(!S.save.seen.intro)playScene(STORY.intro,()=>{S.save.seen.intro=1;persist();showMap();});
    else if(changed)renderTitle();else showMap();
  };
  $('#sceneNext').innerHTML=UI.next;$('#sceneSay').innerHTML=UI.speaker;
  $('#sceneNext').onclick=()=>{ac();sceneNext();};
  $('#sceneSay').onclick=()=>{const sc=S.scene;if(sc)speak(fmt(sc.panels[sc.i].text));};
  $('#sceneSkip').onclick=sceneEnd;
  $('#mapHome').innerHTML=UI.home;$('#mapHome').onclick=renderTitle;
  $('#mapStory').innerHTML=UI.book;$('#mapStory').onclick=()=>{ac();playScene(STORY.intro,showMap);};
  ['#btnTeacherT','#btnTeacherM','#btnTeacherG'].forEach(s=>{$(s).onclick=openTeacher;});
  $('#btnTeacherM').innerHTML=UI.gear;$('#btnTeacherG').innerHTML=UI.gear;
  $('#btnHome').innerHTML=UI.home;
  $('#btnHome').onclick=()=>{S.running=false;S.exec=null;setRunUI(false);hideHand();try{speechSynthesis.cancel();}catch(e){}renderTitle();};
  $('#btnMap').innerHTML=UI.map;
  $('#btnMap').onclick=()=>{S.running=false;S.exec=null;setRunUI(false);try{speechSynthesis.cancel();}catch(e){}showMap();};
  $('#btnMute').onclick=()=>{S.save.settings.mute=!S.save.settings.mute;persist();if(S.save.settings.mute)try{speechSynthesis.cancel();}catch(e){}renderTop();};
  $('#btnSay').innerHTML=UI.speaker;$('#btnSay').onclick=()=>{ac();speak($('#fbText').textContent,{talk:true});};
  $('#btnPlay').innerHTML=UI.play;$('#btnPlay').onclick=onPlay;
  $('#btnStep').innerHTML=UI.step+'<span>Passo</span>';$('#btnStep').onclick=onStep;
  $('#btnReset').innerHTML=UI.reset+'<span>Recomeçar</span>';$('#btnReset').setAttribute('aria-label','Pôr o robô no início do caminho');
  $('#btnReset').onclick=()=>{ac();const had=!!S.exec||S.running;S.running=false;resetActor(false);setRunUI(false);if(!had)animA('hop');sfx('tap');};
  $('#btnClear').innerHTML=UI.clear+'<span>Limpar</span>';
  $('#btnClear').onclick=()=>{if(S.running||S.stepping)return;if(!S.prog.length)return;S.prog=[];S.target='main';sfx('poof');const r=$('#track').getBoundingClientRect();puffAt(r.left+r.width/2,r.top+r.height/2);resetActor(false);renderProgram();};
  $('#btnHint').innerHTML=UI.hint+'<span>Ajuda</span>';$('#btnHint').onclick=showHint;
  $('#track').addEventListener('pointerdown',e=>{if(e.target.id==='track'||e.target.classList.contains('slot')||e.target.closest('.empty-hint'))setTarget('main');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.screen==='teacher')closeTeacher();});
  if('ResizeObserver' in window)new ResizeObserver(()=>{fitBoard();if($('#hand').classList.contains('show'))showHand();}).observe($('#boardWrap'));
  window.addEventListener('resize',fitBoard);
  applySpeed();
}
function boot(data){
  bindStatic();
  data=data||{};
  if(data.screen==='game'&&typeof data.li==='number'&&S.save.robot)openLevel(data.li);
  else if(data.screen==='map'&&S.save.robot)showMap();
  else renderTitle();
}
try{window.claude?.hot?.snapshot?.(()=>({screen:S.screen==='game'||S.screen==='map'?S.screen:'title',li:S.li}));}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data??{});
</script>
</body>
</html>
